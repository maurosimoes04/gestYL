<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperação de Password</title>
</head>
<body style="margin:0;padding:0;background:linear-gradient(135deg,#13233a,#0e1b2d 55%,#0f2e35);font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="min-height:100vh;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="max-width:420px;width:100%;background:linear-gradient(180deg,#0f172a 0%,#0b1220 100%);border:1px solid #1f2937;border-radius:18px;box-shadow:0 18px 38px rgba(0,0,0,0.45);">
          <tr>
            <td align="center" style="padding:32px 28px 0;">
              <img src="https://tnmycajugdovbnqydyvx.supabase.co/storage/v1/object/public/IMAGENS/logo.png" alt="Gestão Financeira YL" width="300" style="display:block;max-width:300px;height:auto;">
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 0;">
              <h1 style="margin:0;color:#f8fafc;font-size:1.3rem;font-weight:700;">Recuperação de password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 28px 0;color:#cbd5e1;font-size:0.95rem;line-height:1.6;">
              Recebemos um pedido para repor a password da sua conta. Clique no botão abaixo para definir uma nova password.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 28px;">
              <a href="{{ .SiteURL }}/reset-password#access_token={{ .Token }}&type=recovery" target="_blank" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#2563eb,#22c55e);color:#ffffff;font-weight:700;font-size:0.95rem;text-decoration:none;border-radius:999px;">
                Repor password
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 8px;color:#64748b;font-size:0.85rem;line-height:1.5;">
              Se não solicitou esta alteração, pode ignorar este email. O link expira em 24 horas.
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px;"><hr style="border:none;border-top:1px solid #1f2937;margin:12px 0;"></td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 28px;color:#475569;font-size:0.8rem;">Gestão Financeira YL — YoungLink</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
