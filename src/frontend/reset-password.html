<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repor Password — Gestor YL</title>
  <link rel="icon" type="image/png" href="/app/logo-original.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #4f46e5;
      --brand-hover: #4338ca;
      --brand-soft: #eef2ff;
      --ink: #0f172a;
      --ink-soft: #475569;
      --ink-muted: #94a3b8;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --surface: #ffffff;
      --surface-page: #f8fafc;
      --good: #15803d;
      --bad: #b91c1c;
      --radius: 10px;
      --shadow: 0 10px 30px -12px rgba(79, 70, 229, 0.18), 0 2px 8px -2px rgba(15, 23, 42, 0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--brand-soft) 0%, var(--surface-page) 50%, #faf5ff 100%);
    }
    .wrap { width: 100%; max-width: 420px; }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand img { width: 220px; height: 110px; object-fit: contain; }
    .brand .tag { font-size: 0.85rem; color: var(--ink-soft); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--ink); }
    .subtitle { font-size: 0.9rem; color: var(--ink-soft); margin-top: -4px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: 600; color: var(--ink); font-size: 0.82rem; }
    .pw-wrap { position: relative; display: flex; align-items: center; }
    input[type="password"], input[type="text"] {
      flex: 1;
      padding: 10px 42px 10px 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    input.input-error { border-color: #dc2626; }
    input.input-ok { border-color: #16a34a; }
    .pw-toggle {
      position: absolute; right: 6px; background: none; border: none; cursor: pointer;
      padding: 6px; color: var(--ink-muted); line-height: 0;
      border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    .pw-toggle:hover { color: var(--ink); background: var(--line-soft); }
    .strength-bar { height: 4px; border-radius: 4px; background: var(--line-soft); overflow: hidden; margin-top: 4px; }
    .strength-fill { height: 100%; border-radius: 4px; width: 0; transition: width 0.25s, background 0.25s; }
    .rules { list-style: none; display: grid; gap: 4px; margin-top: 2px; }
    .rules li {
      font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
      color: var(--ink-muted); transition: color 0.15s;
    }
    .rules li.pass { color: var(--good); }
    .rules li.fail { color: var(--bad); }
    .rules li::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.4;
    }
    .rules li.pass::before, .rules li.fail::before { opacity: 1; }
    .match-hint { font-size: 0.8rem; min-height: 16px; font-weight: 500; }
    .match-hint.ok { color: var(--good); }
    .match-hint.no { color: var(--bad); }
    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--brand-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      text-align: center;
      font-size: 0.85rem;
      min-height: 20px;
      font-weight: 500;
      padding: 2px 0;
    }
    .msg.error { color: var(--bad); }
    .msg.success { color: var(--good); }
    .footer-link {
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-top: 14px;
    }
    .footer-link a { color: var(--brand); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/app/logo-original.png" alt="Young-Link">
      <span class="tag">Repor password — Gestor YL</span>
    </div>
    <div class="card">
      <h1>Repor password</h1>
      <p class="subtitle">Define uma nova password segura para a tua conta.</p>
      <form id="pwForm">
        <div>
          <label for="password">Nova password</label>
          <div class="pw-wrap" style="margin-top:4px;">
            <input id="password" type="password" required autocomplete="new-password" placeholder="••••••••">
            <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Mostrar password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        </div>
        <ul class="rules" id="rules">
          <li id="rLen">Mínimo 8 caracteres</li>
          <li id="rUpper">Uma letra maiúscula</li>
          <li id="rLower">Uma letra minúscula</li>
          <li id="rNum">Um número</li>
          <li id="rSpecial">Um carácter especial (!@#$%...)</li>
        </ul>
        <div>
          <label for="confirm">Confirmar password</label>
          <div class="pw-wrap" style="margin-top:4px;">
            <input id="confirm" type="password" required autocomplete="new-password" placeholder="••••••••">
            <button type="button" class="pw-toggle" onclick="togglePw('confirm', this)" aria-label="Mostrar password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="match-hint" id="matchHint"></div>
        </div>
        <button type="submit" class="btn" id="submitBtn" disabled>Repor password</button>
      </form>
      <p class="msg" id="msg"></p>
    </div>
    <p class="footer-link">Lembraste-te? <a href="/login">Voltar ao login</a></p>
  </div>

  <script>
    const eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeClosed = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword ? eyeClosed : eyeOpen;
    }
  </script>
  <script>
    (async function() {
      const cfgRes = await fetch('/api/config');
      const cfg = await cfgRes.json();
      const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

      const pwInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm');
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const matchHint = document.getElementById('matchHint');
      const strengthFill = document.getElementById('strengthFill');

      let sessionReady = false;

      const rules = {
        rLen:     pw => pw.length >= 8,
        rUpper:   pw => /[A-Z]/.test(pw),
        rLower:   pw => /[a-z]/.test(pw),
        rNum:     pw => /\d/.test(pw),
        rSpecial: pw => /[^A-Za-z0-9]/.test(pw),
      };

      function validate() {
        const pw = pwInput.value;
        const cf = confirmInput.value;
        let passed = 0;
        const total = Object.keys(rules).length;

        for (const [id, fn] of Object.entries(rules)) {
          const el = document.getElementById(id);
          const ok = fn(pw);
          el.className = ok ? 'pass' : (pw.length > 0 ? 'fail' : '');
          if (ok) passed++;
        }

        const pct = (passed / total) * 100;
        strengthFill.style.width = pw.length === 0 ? '0%' : pct + '%';
        strengthFill.style.background = pct <= 40 ? '#dc2626' : pct <= 70 ? '#eab308' : '#16a34a';

        pwInput.className = pw.length === 0 ? '' : (passed === total ? 'input-ok' : 'input-error');

        const match = pw.length > 0 && cf.length > 0 && pw === cf;
        const mismatch = cf.length > 0 && pw !== cf;
        matchHint.textContent = match ? '✓ As passwords coincidem' : (mismatch ? '✗ As passwords não coincidem' : '');
        matchHint.className = 'match-hint ' + (match ? 'ok' : (mismatch ? 'no' : ''));
        confirmInput.className = cf.length === 0 ? '' : (match ? 'input-ok' : 'input-error');

        submitBtn.disabled = !(sessionReady && passed === total && match);
        if (!sessionReady && passed === total && match) {
          msg.textContent = 'A aguardar verificação do link...';
          msg.className = 'msg error';
        }
      }

      pwInput.addEventListener('input', validate);
      confirmInput.addEventListener('input', validate);

      sb.auth.onAuthStateChange((event, session) => {
        if (session) {
          sessionReady = true;
          msg.textContent = '';
          msg.className = 'msg';
          validate();
        }
      });

      (async () => {
        const hash = window.location.hash.substring(1);
        if (hash) {
          const params = new URLSearchParams(hash);
          const accessToken = params.get('access_token');
          const refreshToken = params.get('refresh_token');
          if (accessToken && refreshToken) {
            const { data, error } = await sb.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
            if (data.session) {
              sessionReady = true;
              msg.textContent = '';
              msg.className = 'msg';
              validate();
              return;
            }
            if (error) console.error('Erro ao definir sessão:', error.message);
          }
        }
        const { data } = await sb.auth.getSession();
        if (data.session) { sessionReady = true; validate(); }
        else { msg.textContent = 'Link inválido ou expirado. Pede um novo link de recuperação.'; msg.className = 'msg error'; }
      })();

      document.getElementById('pwForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'A guardar...';
        msg.textContent = '';

        const { error } = await sb.auth.updateUser({ password: pwInput.value });

        if (error) {
          msg.textContent = error.message || 'Erro ao repor password.';
          msg.className = 'msg error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Repor password';
        } else {
          await sb.auth.signOut();
          localStorage.removeItem('authToken');
          localStorage.removeItem('authRole');
          msg.textContent = 'Password atualizada! A redirecionar para o login...';
          msg.className = 'msg success';
          setTimeout(() => { window.location.href = '/login'; }, 1600);
        }
      });
    })();
  </script>
</body>
</html>
