<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Password — Gestor YL</title>
  <link rel="icon" type="image/png" href="/app/logo-original.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #4f46e5;
      --brand-hover: #4338ca;
      --brand-soft: #eef2ff;
      --ink: #0f172a;
      --ink-soft: #475569;
      --ink-muted: #94a3b8;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --surface: #ffffff;
      --surface-page: #f8fafc;
      --good: #15803d;
      --good-soft: #dcfce7;
      --bad: #b91c1c;
      --bad-soft: #fee2e2;
      --radius: 10px;
      --shadow: 0 10px 30px -12px rgba(79, 70, 229, 0.18), 0 2px 8px -2px rgba(15, 23, 42, 0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--brand-soft) 0%, var(--surface-page) 50%, #faf5ff 100%);
    }
    .wrap { width: 100%; max-width: 420px; }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand img { width: 220px; height: 110px; object-fit: contain; }
    .brand .tag { font-size: 0.85rem; color: var(--ink-soft); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--ink); }
    .subtitle { font-size: 0.9rem; color: var(--ink-soft); margin-top: -4px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: 600; color: var(--ink); font-size: 0.82rem; }
    input[type="email"] {
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--brand-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      text-align: center;
      font-size: 0.85rem;
      min-height: 20px;
      font-weight: 500;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .msg.error { color: var(--bad); background: var(--bad-soft); border: 1px solid rgba(185, 28, 28, 0.2); }
    .msg.success { color: var(--good); background: var(--good-soft); border: 1px solid rgba(21, 128, 61, 0.2); }
    .msg:empty { display: none; }
    .footer-link {
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-top: 14px;
    }
    .footer-link a { color: var(--brand); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/app/logo-original.png" alt="Young-Link">
      <span class="tag">Recuperar password — Gestor YL</span>
    </div>
    <div class="card">
      <h1>Esqueceste-te da password?</h1>
      <p class="subtitle">
        Introduz o teu email e enviamos-te um link para definires uma nova password.
      </p>
      <form id="forgotForm">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" placeholder="exemplo@younglink.net" style="margin-top:4px;">
        </div>
        <button type="submit" class="btn" id="submitBtn">Enviar link de recuperação</button>
      </form>
      <p class="msg" id="msg"></p>
    </div>
    <p class="footer-link">Lembraste-te? <a href="/login">Voltar ao login</a></p>
  </div>

  <script>
    (function () {
      const form = document.getElementById('forgotForm');
      const emailInput = document.getElementById('email');
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        btn.disabled = true;
        btn.textContent = 'A enviar...';
        msg.textContent = '';
        msg.className = 'msg';

        try {
          const res = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Erro ao enviar o email.');

          msg.textContent = 'Se o email estiver registado, vais receber um link para definir uma nova password nos próximos minutos. Verifica também o spam.';
          msg.className = 'msg success';
          form.reset();
        } catch (err) {
          msg.textContent = err.message || 'Não foi possível enviar o email de recuperação.';
          msg.className = 'msg error';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Enviar link de recuperação';
        }
      });
    })();
  </script>
</body>
</html>
