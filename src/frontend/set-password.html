<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir Password — Gestão Financeira YL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(circle at 22% 18%, rgba(59,130,246,0.35), transparent 36%),
                  radial-gradient(circle at 78% 10%, rgba(45,212,191,0.35), transparent 40%),
                  linear-gradient(135deg, #13233a, #0e1b2d 55%, #0f2e35);
    }
    .card {
      width: min(420px, 95vw); background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
      border: 1px solid #1f2937; border-radius: 18px; padding: 28px;
      box-shadow: 0 18px 38px rgba(0,0,0,0.45); display: grid; gap: 14px; color: #e2e8f0;
    }
    .logo { width: 280px; justify-self: center; }
    h1 { color: #f8fafc; font-size: 1.3rem; }
    .subtitle { color: #cbd5e1; font-size: 0.95rem; }
    label { font-weight: 600; color: #e2e8f0; font-size: 0.9rem; }
    input {
      padding: 12px 14px; border: 1px solid #1f2937; background: #0f172a;
      color: #e2e8f0; border-radius: 10px; font-size: 1rem; width: 100%;
    }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    input.input-error { border-color: #fb7185; }
    input.input-ok { border-color: #22c55e; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 999px; font-weight: 700;
      font-size: 0.95rem; cursor: pointer; background: linear-gradient(135deg, #2563eb, #22c55e);
      color: #fff; margin-top: 6px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(2,6,23,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .msg { text-align: center; font-size: 0.9rem; min-height: 20px; }
    .msg.error { color: #fb7185; }
    .msg.success { color: #22c55e; }
    form { display: grid; gap: 10px; }
    .rules { list-style: none; padding: 0; display: grid; gap: 4px; margin-top: 4px; }
    .rules li { font-size: 0.82rem; display: flex; align-items: center; gap: 6px; color: #64748b; transition: color 0.2s; }
    .rules li.pass { color: #22c55e; }
    .rules li.fail { color: #fb7185; }
    .rules li::before { content: '○'; font-size: 0.7rem; }
    .rules li.pass::before { content: '●'; }
    .strength-bar { height: 4px; border-radius: 4px; background: #1f2937; margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; width: 0; }
    .match-hint { font-size: 0.82rem; margin-top: 2px; min-height: 16px; }
    .match-hint.ok { color: #22c55e; }
    .match-hint.no { color: #fb7185; }
    .pw-wrap { position: relative; display: flex; align-items: center; }
    .pw-wrap input { flex: 1; padding-right: 44px; }
    .pw-toggle { position: absolute; right: 8px; background: none !important; border: none !important; cursor: pointer; font-size: 1.1rem; padding: 4px !important; opacity: 0.6; transition: opacity 0.2s; line-height: 1; color: #e2e8f0; border-radius: 0 !important; box-shadow: none !important; transform: none !important; }
    .pw-toggle:hover { opacity: 1; transform: none !important; box-shadow: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="card">
    <img src="https://tnmycajugdovbnqydyvx.supabase.co/storage/v1/object/public/IMAGENS/logo.png" alt="Gestão Financeira YL" class="logo">
    <h1>Definir password</h1>
    <p class="subtitle">Crie uma password segura para aceder à plataforma.</p>
    <form id="pwForm">
      <label for="password">Nova password</label>
      <div class="pw-wrap">
        <input id="password" type="password" required autocomplete="new-password">
        <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Mostrar password">👁️</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <ul class="rules" id="rules">
        <li id="rLen">Mínimo 8 caracteres</li>
        <li id="rUpper">Uma letra maiúscula</li>
        <li id="rLower">Uma letra minúscula</li>
        <li id="rNum">Um número</li>
        <li id="rSpecial">Um carácter especial (!@#$%...)</li>
      </ul>
      <label for="confirm">Confirmar password</label>
      <div class="pw-wrap">
        <input id="confirm" type="password" required autocomplete="new-password">
        <button type="button" class="pw-toggle" onclick="togglePw('confirm', this)" aria-label="Mostrar password">👁️</button>
      </div>
      <div class="match-hint" id="matchHint"></div>
      <button type="submit" class="btn" id="submitBtn" disabled>Definir password</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>

  <script>
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.textContent = isPassword ? '🙈' : '👁️';
    }

    const SUPABASE_URL = 'https://tnmycajugdovbnqydyvx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubXljYWp1Z2RvdmJucXlkeXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Njk5MDksImV4cCI6MjA5MTI0NTkwOX0.a5xEOFjJBqpMHYVsPNbFgGMfYcbMm0cMhNsnstMETKs';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const pwInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const matchHint = document.getElementById('matchHint');
    const strengthFill = document.getElementById('strengthFill');

    let sessionReady = false;

    const rules = {
      rLen:     pw => pw.length >= 8,
      rUpper:   pw => /[A-Z]/.test(pw),
      rLower:   pw => /[a-z]/.test(pw),
      rNum:     pw => /\d/.test(pw),
      rSpecial: pw => /[^A-Za-z0-9]/.test(pw),
    };

    function validate() {
      const pw = pwInput.value;
      const cf = confirmInput.value;
      let passed = 0;
      const total = Object.keys(rules).length;

      for (const [id, fn] of Object.entries(rules)) {
        const el = document.getElementById(id);
        const ok = fn(pw);
        el.className = ok ? 'pass' : (pw.length > 0 ? 'fail' : '');
        if (ok) passed++;
      }

      const pct = (passed / total) * 100;
      strengthFill.style.width = pw.length === 0 ? '0%' : pct + '%';
      strengthFill.style.background = pct <= 40 ? '#fb7185' : pct <= 70 ? '#fbbf24' : '#22c55e';

      pwInput.className = pw.length === 0 ? '' : (passed === total ? 'input-ok' : 'input-error');

      const match = pw.length > 0 && cf.length > 0 && pw === cf;
      const mismatch = cf.length > 0 && pw !== cf;
      matchHint.textContent = match ? '✓ As passwords coincidem' : (mismatch ? '✗ As passwords não coincidem' : '');
      matchHint.className = 'match-hint ' + (match ? 'ok' : (mismatch ? 'no' : ''));
      confirmInput.className = cf.length === 0 ? '' : (match ? 'input-ok' : 'input-error');

      submitBtn.disabled = !(sessionReady && passed === total && match);
      if (!sessionReady && passed === total && match) {
        msg.textContent = 'A aguardar verificação do link...';
        msg.className = 'msg error';
      }
    }

    pwInput.addEventListener('input', validate);
    confirmInput.addEventListener('input', validate);

    supabase.auth.onAuthStateChange((event, session) => {
      console.log('Auth event:', event, session ? 'com sessão' : 'sem sessão');
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
        if (session) {
          sessionReady = true;
          msg.textContent = '';
          msg.className = 'msg';
          validate();
        }
      }
    });

    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data.session) { sessionReady = true; validate(); }
      else { msg.textContent = 'A verificar o link... Se demorar, o link pode ter expirado.'; msg.className = 'msg error'; }
    })();

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'A guardar...';
      msg.textContent = '';

      const { error } = await supabase.auth.updateUser({ password: pwInput.value });

      if (error) {
        msg.textContent = error.message || 'Erro ao definir password.';
        msg.className = 'msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Definir password';
      } else {
        await supabase.auth.signOut();
        localStorage.removeItem('authToken');
        localStorage.removeItem('authRole');
        msg.textContent = 'Password definida com sucesso! A redirecionar para o login...';
        msg.className = 'msg success';
        setTimeout(() => { window.location.href = '/login'; }, 2000);
      }
    });
  </script>
</body>
</html>
