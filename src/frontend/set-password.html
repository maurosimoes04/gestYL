<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir Password — Gestão Financeira YL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 22% 18%, rgba(59,130,246,0.35), transparent 36%),
                  radial-gradient(circle at 78% 10%, rgba(45,212,191,0.35), transparent 40%),
                  linear-gradient(135deg, #13233a, #0e1b2d 55%, #0f2e35);
    }
    .card {
      width: min(420px, 95vw);
      background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 38px rgba(0,0,0,0.45);
      display: grid;
      gap: 14px;
      color: #e2e8f0;
    }
    .logo { width: 280px; justify-self: center; }
    h1 { color: #f8fafc; font-size: 1.3rem; }
    .subtitle { color: #cbd5e1; font-size: 0.95rem; }
    label { font-weight: 600; color: #e2e8f0; font-size: 0.9rem; }
    input {
      padding: 12px 14px;
      border: 1px solid #1f2937;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      width: 100%;
    }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #22c55e);
      color: #fff;
      margin-top: 6px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(2,6,23,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .msg { text-align: center; font-size: 0.9rem; min-height: 20px; }
    .msg.error { color: #fb7185; }
    .msg.success { color: #22c55e; }
    form { display: grid; gap: 10px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="card">
    <img src="https://tnmycajugdovbnqydyvx.supabase.co/storage/v1/object/public/IMAGENS/logo.png" alt="Gestão Financeira YL" class="logo">
    <h1>Definir password</h1>
    <p class="subtitle">Crie uma password para aceder à plataforma.</p>
    <form id="setPasswordForm">
      <label for="password">Nova password</label>
      <input id="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres">
      <label for="confirmPassword">Confirmar password</label>
      <input id="confirmPassword" type="password" minlength="6" required>
      <button type="submit" class="btn" id="submitBtn">Definir password</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://tnmycajugdovbnqydyvx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubXljYWp1Z2RvdmJucXlkeXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Njk5MDksImV4cCI6MjA5MTI0NTkwOX0.a5xEOFjJBqpMHYVsPNbFgGMfYcbMm0cMhNsnstMETKs';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('setPasswordForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    // Esperar que o Supabase processe o token do hash automaticamente
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        // Sessão válida, utilizador pode definir password
        submitBtn.disabled = false;
      }
    });

    // Verificar se já há sessão (caso o evento já tenha disparado)
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        msg.textContent = 'A verificar o link... Se demorar, o link pode ter expirado.';
        msg.className = 'msg error';
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        msg.textContent = 'As passwords não coincidem.';
        msg.className = 'msg error';
        return;
      }

      if (password.length < 6) {
        msg.textContent = 'A password deve ter pelo menos 6 caracteres.';
        msg.className = 'msg error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'A guardar...';
      msg.textContent = '';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        msg.textContent = error.message || 'Erro ao definir password.';
        msg.className = 'msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Definir password';
      } else {
        // Limpar sessão do Supabase (o login é feito pelo backend)
        await supabase.auth.signOut();
        localStorage.removeItem('authToken');
        localStorage.removeItem('authRole');
        msg.textContent = 'Password definida com sucesso! A redirecionar para o login...';
        msg.className = 'msg success';
        setTimeout(() => { window.location.href = '/'; }, 2000);
      }
    });
  </script>
</body>
</html>
