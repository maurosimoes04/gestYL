<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Item de Inventário — Young-Link</title>
  <link rel="icon" type="image/png" href="https://tnmycajugdovbnqydyvx.supabase.co/storage/v1/object/public/IMAGENS/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #4f46e5;
      --brand-hover: #4338ca;
      --brand-soft: #eef2ff;
      --ink: #0a0a0a;
      --ink-soft: #6b7280;
      --ink-muted: #9ca3af;
      --surface: #ffffff;
      --surface-alt: #f4f4f8;
      --surface-page: #f8f9fc;
      --line: #e5e7eb;
      --good: #16a34a;
      --good-soft: #dcfce7;
      --warn: #f59e0b;
      --warn-soft: #fef3c7;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--surface-page);
      padding: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .tabular { font-variant-numeric: tabular-nums; }

    .shell { width: min(500px, 100%); }

    .brand-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .brand-mark {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      color: #fff; font-weight: 800;
      display: grid; place-items: center;
      font-size: 0.95rem;
    }
    .brand-name {
      font-weight: 700; font-size: 1.05rem; color: var(--ink);
    }
    .brand-sub {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 2px; color: var(--ink-muted); font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 30px -10px rgba(10,10,10,.1);
      overflow: hidden;
    }

    .card-head {
      padding: 24px 24px 20px;
      background: linear-gradient(135deg, var(--brand) 0%, #7c3aed 100%);
      color: #fff;
    }
    .card-head .label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 2.5px;
      opacity: .9; font-weight: 600; display: inline-block; margin-bottom: 8px;
      background: rgba(255,255,255,.14); padding: 3px 10px; border-radius: 999px;
    }
    .card-head .codigo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.4rem; font-weight: 700;
      letter-spacing: -0.02em; margin: 4px 0 6px; line-height: 1;
    }
    .card-head .nome {
      font-size: 1.1rem; font-weight: 500; opacity: .95;
      line-height: 1.3;
    }

    .card-body { padding: 20px 24px 24px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .chip {
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 999px;
      background: var(--brand-soft); color: var(--brand);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .chip.good { background: var(--good-soft); color: var(--good); }
    .chip.warn { background: var(--warn-soft); color: #92400e; }
    .chip.neutral { background: var(--surface-alt); color: var(--ink-soft); }

    .rows { border-top: 1px solid var(--line); }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .row:last-child { border-bottom: 0; }
    .row .k {
      color: var(--ink-soft); font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .row .v {
      color: var(--ink); font-weight: 600; text-align: right;
    }
    .row .v.mono { font-family: 'JetBrains Mono', monospace; }

    .icon {
      width: 14px; height: 14px;
      color: var(--ink-muted);
    }

    .foot {
      padding: 14px 24px;
      background: var(--surface-alt);
      border-top: 1px solid var(--line);
      color: var(--ink-muted);
      font-size: 0.72rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .msg-estado {
      padding: 36px 24px;
      text-align: center;
      color: var(--ink-soft);
    }
    .msg-estado .ico {
      width: 48px; height: 48px; margin: 0 auto 12px;
      border-radius: 50%; background: var(--surface-alt);
      display: grid; place-items: center; color: var(--ink-muted);
      font-size: 1.5rem;
    }
    .msg-estado .ttl {
      font-size: 1.05rem; font-weight: 600; color: var(--ink); margin-bottom: 4px;
    }
    .msg-estado .sub { font-size: 0.88rem; }

    .skel {
      background: linear-gradient(90deg, var(--surface-alt) 0%, #e8e8ec 50%, var(--surface-alt) 100%);
      background-size: 200% 100%;
      animation: shine 1.2s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-line { height: 14px; margin: 8px 0; }
    .skel-line.big { height: 32px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand-top">
      <div class="brand-mark">YL</div>
      <div>
        <div class="brand-name">Young-Link</div>
        <div class="brand-sub">Inventário</div>
      </div>
    </div>

    <div class="card" id="card">
      <!-- Estado inicial: skeleton -->
      <div class="card-head">
        <span class="label">A carregar…</span>
        <div class="skel skel-line big" style="width:60%"></div>
        <div class="skel skel-line" style="width:85%; margin-top:12px;"></div>
      </div>
      <div class="card-body">
        <div class="skel skel-line" style="width:40%"></div>
        <div class="skel skel-line" style="width:70%"></div>
        <div class="skel skel-line" style="width:55%"></div>
      </div>
    </div>
  </div>
  <script src="/assets/js/item.js?v=20261005"></script>
</body>
</html>
